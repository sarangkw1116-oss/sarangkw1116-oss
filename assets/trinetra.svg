<svg xmlns="http://www.w3.org/2000/svg"
     width="1000" height="300" viewBox="0 0 1000 300"
     role="img" aria-labelledby="title description">

  <title id="title">Trinetra — Team BareMetal</title>
  <desc id="description">
    An animated Neo-Brutalist banner for Trinetra.
    A shared sensor core connects to a mobile robot,
    fixed node, and handheld device.
    A railway screening concept by Team BareMetal.
  </desc>

  <defs>
    <pattern id="grid" width="22" height="22"
             patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22"
            fill="none" stroke="#191919" stroke-opacity=".06"/>
    </pattern>

    <style>
      text {
        font-family: Arial, Helvetica, sans-serif;
      }

      .mono {
        font-family: Consolas, 'Liberation Mono', monospace;
      }

      .flow {
        stroke-dasharray: 5 9;
        animation: flow 4s linear infinite;
      }

      .press {
        animation: press 6s ease-in-out infinite;
      }

      @keyframes flow {
        to { stroke-dashoffset: -56; }
      }

      @keyframes press {
        0%, 25%, 100% { transform: translate(0, 0); }
        45%, 60% { transform: translate(3px, 3px); }
      }

      @media (prefers-reduced-motion: reduce) {
        .flow, .press { animation: none; }
      }
    </style>
  </defs>

  <!-- Paper and hard shadow -->
  <rect width="1000" height="300" fill="#f6f2e9"/>

  <rect x="26" y="26" width="956" height="256"
        fill="#191919"/>

  <rect x="18" y="18" width="956" height="256"
        fill="#d9f0e4" stroke="#191919" stroke-width="3.5"/>

  <rect x="20" y="53" width="952" height="219"
        fill="url(#grid)"/>

  <!-- Header strip -->
  <rect x="18" y="18" width="956" height="35"
        fill="#191919"/>

  <text x="37" y="41"
        class="mono" font-size="11" font-weight="700"
        letter-spacing="1.1" fill="#ffffff">
    TRINETRA / TEAM BAREMETAL
  </text>

  <text x="954" y="41" text-anchor="end"
        class="mono" font-size="10" font-weight="700"
        fill="#d9f0e4">
    PROJECT 01
  </text>

  <!-- Project identity -->
  <text x="38" y="136"
        font-size="70" font-weight="900"
        letter-spacing="-3.5" fill="#191919">
    TRINETRA
  </text>

  <text x="42" y="174"
        class="mono" font-size="16" font-weight="700"
        fill="#191919">
    ONE CORE. THREE FORM FACTORS.
  </text>

  <text x="42" y="204"
        font-size="15" fill="#314c3e">
    A modular railway screening concept.
  </text>

  <!-- Status label -->
  <rect x="46" y="231" width="226" height="27"
        fill="#191919"/>

  <rect x="42" y="227" width="226" height="27"
        fill="#ffe45b" stroke="#191919" stroke-width="2"/>

  <text x="55" y="245"
        class="mono" font-size="10" font-weight="700"
        letter-spacing=".7" fill="#191919">
    CONCEPT + SIMULATION
  </text>

  <!-- Architecture area -->
  <path d="M614 73V254"
        fill="none" stroke="#191919"
        stroke-width="2" stroke-dasharray="3 7"/>

  <!-- Proposed device connections -->
  <g fill="none" stroke="#789d89" stroke-width="2">
    <path d="M773 143L706 102"/>
    <path d="M809 143L881 102"/>
    <path d="M791 174V221"/>
  </g>

  <g class="flow" fill="none"
     stroke="#191919" stroke-width="2.5">
    <path d="M773 143L706 102"/>
    <path d="M809 143L881 102"/>
    <path d="M791 174V221"/>
  </g>

  <!-- Mobile robot -->
  <g transform="translate(692 94)"
     stroke="#191919" stroke-width="2.5">
    <path d="M0-13V-23M-6-23H6" fill="none"/>

    <rect x="-25" y="-12" width="50" height="24"
          fill="#fffaf0"/>

    <circle cx="-16" cy="16" r="7" fill="#191919"/>
    <circle cx="16" cy="16" r="7" fill="#191919"/>

    <rect x="-5" y="-5" width="10" height="8"
          fill="#ffe45b" stroke-width="2"/>
  </g>

  <!-- Fixed node -->
  <g transform="translate(896 94)"
     stroke="#191919" stroke-width="2.5">
    <rect x="-13" y="-18" width="26" height="35"
          fill="#fffaf0"/>

    <path d="M0-18V-27M-7 17V24M7 17V24M-17 24H17"
          fill="none"/>

    <rect x="-5" y="-10" width="10" height="9"
          fill="#ffe45b" stroke-width="2"/>

    <path d="M-6 8H6" fill="none"/>
  </g>

  <!-- Shared sensor core -->
  <g transform="translate(791 153)">
    <rect x="-20" y="-20" width="46" height="46"
          fill="#191919"/>

    <g class="press">
      <rect x="-25" y="-25" width="46" height="46"
            fill="#ffe45b" stroke="#191919" stroke-width="3"/>

      <rect x="-12" y="-12" width="20" height="20"
            fill="#191919"/>

      <g stroke="#191919" stroke-width="2">
        <path d="M-8-19V-13M3-19V-13M-8 9V15M3 9V15"/>
        <path d="M-19-8H-13M-19 3H-13M9-8H15M9 3H15"/>
      </g>
    </g>
  </g>

  <!-- Handheld -->
  <g transform="translate(791 237)"
     stroke="#191919" stroke-width="2.5">
    <rect x="-12" y="-18" width="24" height="35"
          fill="#fffaf0"/>

    <rect x="-7" y="-12" width="14" height="15"
          fill="#ffe45b" stroke-width="2"/>

    <path d="M-3 10H3" fill="none"/>
  </g>

  <!-- Device captions -->
  <g class="mono" font-size="9" font-weight="700"
     fill="#191919" text-anchor="middle">
    <text x="692" y="134">ROBOT</text>
    <text x="896" y="137">FIXED NODE</text>
    <text x="838" y="197">SENSOR CORE</text>
    <text x="849" y="246">HANDHELD</text>
  </g>
</svg>
