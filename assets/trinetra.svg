<svg xmlns="http://www.w3.org/2000/svg"
     width="1000" height="300" viewBox="0 0 1000 300"
     role="img" aria-labelledby="title desc">
  <title id="title">Trinetra — Team BareMetal</title>
  <desc id="desc">
    An animated concept graphic showing a shared sensor core
    connected to a robot, handheld device, and fixed node.
  </desc>

  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#192332"/>
      <stop offset="1" stop-color="#101722"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#7dd3fc" stop-opacity=".14"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none"
            stroke="#93c5fd" stroke-opacity=".035"/>
    </pattern>

    <style>
      .flow {
        stroke-dasharray: 5 13;
        animation: flow 3s linear infinite;
      }
      .pulse {
        transform-box: fill-box;
        transform-origin: center;
        animation: pulse 3.6s ease-in-out infinite;
      }
      .node { animation: node 4s ease-in-out infinite; }
      .second { animation-delay: 1.3s; }
      .third { animation-delay: 2.6s; }

      @keyframes flow {
        to { stroke-dashoffset: -72; }
      }
      @keyframes pulse {
        0%,100% { transform: scale(.96); opacity: .45; }
        50% { transform: scale(1.10); opacity: 1; }
      }
      @keyframes node {
        0%,100% { opacity: .55; }
        45% { opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        .flow,.pulse,.node { animation: none; }
      }
    </style>
  </defs>

  <rect x="1" y="1" width="998" height="298" rx="16"
        fill="url(#background)" stroke="#344155" stroke-width="2"/>
  <rect x="12" y="12" width="976" height="276" rx="12"
        fill="url(#grid)"/>

  <!-- Terminal title bar -->
  <path d="M1 45H999" stroke="#344155"/>
  <circle cx="25" cy="23" r="4.5" fill="#db8985"/>
  <circle cx="42" cy="23" r="4.5" fill="#ddbd79"/>
  <circle cx="59" cy="23" r="4.5" fill="#8bb7a0"/>

  <g font-family="Consolas, 'Liberation Mono', monospace">
    <text x="83" y="28" fill="#a8b5c7" font-size="12">
      projects / trinetra
    </text>
    <text x="968" y="28" text-anchor="end"
          fill="#8291a7" font-size="11">01</text>

    <!-- Project identity -->
    <text x="34" y="88" fill="#93c5fd" font-size="12"
          letter-spacing="2">TEAM BAREMETAL</text>
    <text x="32" y="146" fill="#f1f5f9" font-size="51"
          font-weight="700" letter-spacing="-2">TRINETRA</text>

    <text x="34" y="180" fill="#b6c3d5" font-size="16">
      One core. Three form factors.
    </text>
    <text x="34" y="211" fill="#8291a7" font-size="13">
      A modular railway screening concept.
    </text>

    <rect x="34" y="242" width="167" height="27" rx="6"
          fill="#213347" stroke="#38536c"/>
    <text x="48" y="260" fill="#bae6fd" font-size="11">
      CONCEPT + SIMULATION
    </text>
  </g>

  <!-- Sensor architecture illustration -->
  <circle cx="759" cy="166" r="119" fill="url(#halo)"/>

  <g fill="none" stroke="#34465c" stroke-width="2">
    <path d="M752 160L645 110"/>
    <path d="M772 160L886 110"/>
    <path d="M761 178V229"/>
  </g>

  <g class="flow" fill="none" stroke="#93c5fd" stroke-width="2">
    <path d="M752 160L645 110"/>
    <path d="M772 160L886 110"/>
    <path d="M761 178V229"/>
  </g>

  <!-- Shared core -->
  <circle class="pulse" cx="761" cy="164" r="40"
          fill="none" stroke="#7dd3fc" stroke-width="1.5"/>
  <rect x="735" y="138" width="52" height="52" rx="13"
        fill="#20364b" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="749" y="152" width="24" height="24" rx="5"
        fill="#93c5fd" fill-opacity=".12" stroke="#bae6fd"/>

  <g stroke="#bae6fd" stroke-width="1.5">
    <path d="M755 145V151M767 145V151M755 177V183M767 177V183"/>
    <path d="M742 158H748M742 170H748M774 158H780M774 170H780"/>
  </g>

  <!-- Robot -->
  <g class="node" stroke="#b6d9f4" stroke-width="2" fill="#192635">
    <rect x="600" y="75" width="63" height="31" rx="9"/>
    <circle cx="612" cy="111" r="9"/>
    <circle cx="651" cy="111" r="9"/>
    <path d="M631 75V62M624 62H638" fill="none"/>
    <circle cx="631" cy="87" r="4" fill="#93c5fd" stroke="none"/>
  </g>

  <!-- Fixed node -->
  <g class="node second" stroke="#b6d9f4" stroke-width="2" fill="none">
    <rect x="870" y="73" width="34" height="43" rx="7" fill="#192635"/>
    <path d="M887 73V60M881 116V126M893 116V126M875 126H899"/>
    <path d="M876 61Q887 49 898 61" stroke-opacity=".5"/>
    <circle cx="887" cy="88" r="4" fill="#93c5fd" stroke="none"/>
    <path d="M880 103H894"/>
  </g>

  <!-- Handheld -->
  <g class="node third" stroke="#b6d9f4" stroke-width="2">
    <rect x="745" y="225" width="32" height="42" rx="7" fill="#192635"/>
    <rect x="751" y="232" width="20" height="17" rx="3"
          fill="#93c5fd" fill-opacity=".15"/>
    <path d="M758 257H764" fill="none"/>
  </g>

  <g font-family="Consolas, monospace" font-size="10"
     fill="#9cacc0" text-anchor="middle">
    <text x="632" y="140">ROBOT</text>
    <text x="887" y="146">FIXED NODE</text>
    <text x="761" y="284">HANDHELD</text>
  </g>
</svg>
