<svg xmlns="http://www.w3.org/2000/svg"
     width="1000" height="390" viewBox="0 0 1000 390"
     role="img" aria-labelledby="title description">

  <title id="title">Sarang Warudkar — welcome</title>
  <desc id="description">
    A minimalist portfolio welcome screen with a warm white background,
    an animated blue underline, and a slowly rotating geometric accent.
    Sarang Warudkar — exploring software, hardware, and thoughtful design.
    Part of Team BareMetal.
  </desc>

  <defs>
    <radialGradient id="wash">
      <stop offset="0" stop-color="#e4edf8"/>
      <stop offset="1" stop-color="#f8f7f4"/>
    </radialGradient>

    <linearGradient id="underline" x2="1" y2="0">
      <stop stop-color="#527ab0"/>
      <stop offset="1" stop-color="#a6bddb"/>
    </linearGradient>

    <style>
      .orbit {
        animation: orbit 36s linear infinite;
      }

      .counter-orbit {
        animation: counter-orbit 48s linear infinite;
      }

      .underline {
        stroke-dasharray: 510;
        stroke-dashoffset: 0;
        animation: draw 9s ease-in-out infinite;
      }

      .status {
        animation: breathe 3.5s ease-in-out infinite;
      }

      @keyframes orbit {
        to { transform: rotate(360deg); }
      }

      @keyframes counter-orbit {
        to { transform: rotate(-360deg); }
      }

      @keyframes draw {
        0%, 8% { stroke-dashoffset: 510; }
        30%, 88% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -510; }
      }

      @keyframes breathe {
        0%, 100% { opacity: .45; }
        50% { opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        .orbit,
        .counter-orbit,
        .underline,
        .status {
          animation: none;
        }
      }
    </style>
  </defs>

  <!-- Page surface -->
  <rect x="1" y="1" width="998" height="388" rx="18"
        fill="#f8f7f4" stroke="#e4e3df" stroke-width="2"/>

  <!-- Quiet website-style masthead -->
  <rect x="35" y="27" width="35" height="35" rx="10"
        fill="#202b39"/>

  <text x="52.5" y="50" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="18" font-weight="700" fill="#ffffff">s.</text>

  <text x="85" y="49"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13" font-weight="600" fill="#344152">
    sarang / portfolio
  </text>

  <text x="960" y="49" text-anchor="end"
        font-family="Consolas, monospace"
        font-size="11" fill="#75808c">
    CODE · CREATE · LEARN
  </text>

  <path d="M35 80H965" stroke="#e4e3df"/>

  <!-- Main introduction -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="124"
          font-size="11" letter-spacing="2.4" fill="#697787">
      HELLO, WELCOME TO MY CORNER OF GITHUB
    </text>

    <text x="37" y="193"
          font-size="56" font-weight="700"
          letter-spacing="-2.2" fill="#202b39">
      Sarang Warudkar.
    </text>

    <path class="underline"
          d="M41 212C170 219 347 203 526 211"
          fill="none" stroke="url(#underline)"
          stroke-width="4" stroke-linecap="round"/>

    <text x="40" y="251" font-size="18" fill="#576474">
      Exploring software, hardware,
    </text>

    <text x="40" y="278" font-size="18" fill="#576474">
      and thoughtful design.
    </text>
  </g>

  <!-- Decorative geometry -->
  <g transform="translate(797 205)">
    <circle r="111" fill="url(#wash)"/>
    <circle r="89" fill="none" stroke="#d4dfed"/>
    <circle r="61" fill="none" stroke="#e0e6ed"/>

    <g class="orbit">
      <ellipse rx="94" ry="43"
               fill="none" stroke="#91a9c8" stroke-width="1.3"/>
      <circle cx="94" r="5" fill="#527ab0"/>
      <circle cx="-94" r="3" fill="#9db1cb"/>
    </g>

    <g class="counter-orbit">
      <ellipse rx="43" ry="94"
               fill="none" stroke="#b1bfce" stroke-width="1.3"/>
      <circle cy="-94" r="4" fill="#819ab8"/>
    </g>

    <rect x="-25" y="-25" width="50" height="50" rx="15"
          fill="#f8f7f4" stroke="#cad6e4"/>

    <text x="0" y="7" text-anchor="middle"
          font-family="Consolas, monospace"
          font-size="23" fill="#527ab0">&lt;/&gt;</text>
  </g>

  <!-- Footer strip -->
  <path d="M35 327H965" stroke="#e4e3df"/>

  <circle class="status" cx="44" cy="357" r="4" fill="#648f79"/>

  <text x="59" y="361"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12" fill="#576474">
    Building with Team BareMetal
  </text>

  <text x="959" y="361" text-anchor="end"
        font-family="Consolas, monospace"
        font-size="11" fill="#75808c">
    SELECTED WORK ↓
  </text>
</svg>
